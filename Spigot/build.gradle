base {
    archivesName = 'PermissifySpigot'
}

repositories {
    maven {
        url = uri('https://hub.spigotmc.org/nexus/repository/snapshots/')
        content {
            includeGroup 'org.spigotmc'
        }
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    implementation project(':API')
    testImplementation 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
}

def pluginVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property 'version', pluginVersion
    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

tasks.named('jar') {
    archiveFileName = 'PermissifySpigot.jar'
    from project(':API').sourceSets.main.output
}


tasks.named('test') {
    useJUnitPlatform()
}
